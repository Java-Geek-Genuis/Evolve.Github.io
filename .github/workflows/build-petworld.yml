name: PetWorld Mobile Build

on:
  push:
    branches: [ petworld-mobile-v1 ]
    paths:
      - 'PetWorldMobile/**'
      - '.github/workflows/build-petworld.yml'
  pull_request:
    paths:
      - 'PetWorldMobile/**'
      - '.github/workflows/build-petworld.yml'
  workflow_dispatch:

concurrency:
  group: petworld-mobile-build
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core gameplay tests
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run self tests
        shell: pwsh
        run: dotnet run --project PetWorldMobile/Tests/PetWorld.SelfTest.csproj -c Release

  uwp-arm:
    name: Build and sign UWP ARM package
    runs-on: windows-2022
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Verify UWP targets
        shell: pwsh
        run: |
          $roots = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\WindowsXaml",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\WindowsXaml",
            "C:\Program Files\Microsoft Visual Studio",
            "C:\Program Files (x86)\Microsoft Visual Studio"
          )
          $found = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $found = Get-ChildItem $root -Recurse -Filter Microsoft.Windows.UI.Xaml.CSharp.targets -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { break }
            }
          }
          if (-not $found) { throw "Microsoft.Windows.UI.Xaml.CSharp.targets is missing from the installed UWP tooling." }
          Write-Host "Found UWP C# XAML targets at $($found.FullName)"

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore PetWorldMobile/PetWorldMobile.sln
      - name: Build UWP ARM package
        shell: pwsh
        run: >
          msbuild PetWorldMobile/PetWorldMobile.sln
          /m
          /p:Configuration=Release
          /p:Platform=ARM
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=true
      - name: Collect unsigned APPX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $files = Get-ChildItem -Path PetWorldMobile -Recurse -Filter *.appx
          if (-not $files) { throw "No APPX was produced." }
          $files | Copy-Item -Destination artifacts -Force
      - name: Create temporary signing certificate
        shell: pwsh
        run: |
          $openssl = "C:\Program Files\Git\usr\bin\openssl.exe"
          if (-not (Test-Path $openssl)) { $openssl = (Get-Command openssl -ErrorAction SilentlyContinue).Source }
          if (-not $openssl) { throw "OpenSSL was not found on the hosted runner." }
          $publisher = "CN=BlazeBinky PetWorld"
          $keyPath = "$env:RUNNER_TEMP\PetWorldSigning.key.pem"
          $crtPath = "$env:RUNNER_TEMP\PetWorldSigning.cert.pem"
          $pfxPath = "$env:RUNNER_TEMP\PetWorldSigning.pfx"
          $cfgPath = "$env:RUNNER_TEMP\PetWorldSigning.cnf"
          @"
          [req]
          distinguished_name = req_distinguished_name
          x509_extensions = v3_codesigning
          prompt = no
          [req_distinguished_name]
          CN = BlazeBinky PetWorld
          [v3_codesigning]
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature
          extendedKeyUsage = codeSigning
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid,issuer
          "@ | Set-Content -Path $cfgPath -Encoding ascii
          & $openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1095 -keyout $keyPath -out $crtPath -config $cfgPath
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL certificate creation failed." }
          $pwdText = [Guid]::NewGuid().ToString()
          & $openssl pkcs12 -export -out $pfxPath -inkey $keyPath -in $crtPath -passout "pass:$pwdText" -name "BlazeBinky PetWorld"
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL PFX export failed." }
          & $openssl x509 -in $crtPath -outform DER -out "$env:GITHUB_WORKSPACE\artifacts\PetWorldMobile.cer"
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL certificate export failed." }
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath, $pwdText)
          if ($cert.Subject -cne $publisher) { throw "Certificate subject '$($cert.Subject)' does not exactly match manifest publisher '$publisher'." }
          $pwd = ConvertTo-SecureString $pwdText -AsPlainText -Force
          Import-Certificate -FilePath "$env:GITHUB_WORKSPACE\artifacts\PetWorldMobile.cer" -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null
          Copy-Item $pfxPath "$env:RUNNER_TEMP\PetWorldSigning.pfx" -Force
          "PETWORLD_PFX_PASSWORD=$pwdText" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Sign APPX
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found." }
          $appx = Get-ChildItem artifacts -Filter *.appx | Select-Object -First 1
          if (-not $appx) { throw "APPX not found." }
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\PetWorldSigning.pfx" /p "$env:PETWORLD_PFX_PASSWORD" "$($appx.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE." }
          & $signtool.FullName verify /pa /all "$($appx.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "APPX signature verification failed." }
      - name: Upload signed ARM package
        uses: actions/upload-artifact@v4
        with:
          name: PetWorld-Mobile-ARM-signed
          path: artifacts/*
