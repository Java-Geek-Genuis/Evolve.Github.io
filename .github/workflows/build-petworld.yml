name: PetWorld Mobile Build

on:
  push:
    branches: [ petworld-mobile-v1 ]
    paths:
      - 'PetWorldMobile/**'
      - '.github/workflows/build-petworld.yml'
  pull_request:
    paths:
      - 'PetWorldMobile/**'
      - '.github/workflows/build-petworld.yml'
  workflow_dispatch:

concurrency:
  group: petworld-mobile-build
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core gameplay tests
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run self tests
        shell: pwsh
        run: dotnet run --project PetWorldMobile/Tests/PetWorld.SelfTest.csproj -c Release

  uwp-arm:
    name: Build and sign UWP ARM package
    runs-on: windows-2022
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Verify UWP targets
        shell: pwsh
        run: |
          $roots = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\WindowsXaml",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\WindowsXaml",
            "C:\Program Files\Microsoft Visual Studio",
            "C:\Program Files (x86)\Microsoft Visual Studio"
          )
          $found = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $found = Get-ChildItem $root -Recurse -Filter Microsoft.Windows.UI.Xaml.CSharp.targets -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { break }
            }
          }
          if (-not $found) { throw "Microsoft.Windows.UI.Xaml.CSharp.targets is missing from the installed UWP tooling." }
          Write-Host "Found UWP C# XAML targets at $($found.FullName)"

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore PetWorldMobile/PetWorldMobile.sln
      - name: Build UWP ARM package
        shell: pwsh
        run: >
          msbuild PetWorldMobile/PetWorldMobile.sln
          /m
          /p:Configuration=Release
          /p:Platform=ARM
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=true
      - name: Collect unsigned APPX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $files = Get-ChildItem -Path PetWorldMobile -Recurse -Filter "PetWorldMobile_*.appx"
          $main = $files | Where-Object { $_.Name -eq "PetWorldMobile_1.0.0.0_ARM.appx" } | Select-Object -First 1
          if (-not $main) { throw "The expected ARM PetWorld package was not produced." }
          Copy-Item $main.FullName -Destination artifacts -Force
          Write-Host "Collected main app package: $($main.FullName)"
      - name: Create temporary signing certificate
        shell: pwsh
        run: |
          $publisher = "CN=BlazeBinky PetWorld"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyUsage DigitalSignature -KeyExportPolicy Exportable -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(3)
          if ($cert.Subject -cne $publisher) { throw "Certificate subject '$($cert.Subject)' does not exactly match manifest publisher '$publisher'." }
          $pwd = ConvertTo-SecureString ([Guid]::NewGuid().ToString()) -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\PetWorldSigning.pfx" -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\artifacts\PetWorldMobile.cer" | Out-Null
          $secret = [System.Net.NetworkCredential]::new("", $pwd).Password
          "PETWORLD_PFX_PASSWORD=$secret" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Sign APPX
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found." }
          $appx = Get-ChildItem artifacts -Filter "PetWorldMobile_1.0.0.0_ARM.appx" | Select-Object -First 1
          if (-not $appx) { throw "Main ARM APPX not found." }
          & $signtool.FullName sign /debug /fd SHA256 /f "$env:RUNNER_TEMP\PetWorldSigning.pfx" /p "$env:PETWORLD_PFX_PASSWORD" "$($appx.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE." }
          & $signtool.FullName verify /pa /v "$($appx.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "Signed APPX verification failed with exit code $LASTEXITCODE." }
          Write-Host "Signed and verified $($appx.Name). The companion .cer is included for phone trust."
      - name: Upload signed ARM package
        uses: actions/upload-artifact@v4
        with:
          name: PetWorld-Mobile-ARM-signed
          path: artifacts/*
